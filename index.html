<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online chat</title>
<style>
  :root{
    --bg:#eef1ee; --panel:#ffffff; --ink:#1d2a24; --muted:#6b7a72;
    --mine:#1f6b4f; --mine-ink:#ffffff; --other:#e3e9e5; --line:#d5ddd8; --danger:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141a17; --panel:#1c2420; --ink:#e6eee9; --muted:#8fa097;
      --mine:#2e8f69; --other:#2a342f; --line:#2f3a35; }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
    display:flex;justify-content:center}
  .app{width:100%;max-width:720px;height:100%;display:flex;flex-direction:column;background:var(--panel);
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0}
  header small{color:var(--muted);display:block;font-size:12px}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px}
  .btn{background:var(--mine);color:var(--mine-ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.admin-on{background:var(--danger);color:#fff}
  #list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--other);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
  .msg.mine{background:var(--mine);color:var(--mine-ink);align-self:flex-end}
  .msg .meta{font-size:12px;opacity:.75;margin-bottom:2px}
  .msg .row{display:flex;gap:8px;align-items:flex-start}
  .msg .del{background:var(--danger);color:#fff;padding:2px 8px;font-size:12px;border-radius:6px;flex-shrink:0}
  .empty{margin:auto;color:var(--muted);text-align:center}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  input[type=text]{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
  #nick{flex:0 0 120px}
  .bar{padding:6px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
  .bar.warn{background:#fff4d6;color:#6a5200}
  :focus-visible{outline:2px solid var(--mine);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>Online chat</h1><small id="status">Ulanmoqda…</small></div>
    <button id="adminBtn" class="btn ghost" type="button">Admin panel</button>
  </header>
  <div id="warn" class="bar warn" hidden></div>
  <div id="list" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input id="nick" type="text" placeholder="Ismingiz" maxlength="20" required>
    <input id="text" type="text" placeholder="Xabar yozing…" maxlength="500" required>
    <button class="btn" type="submit">Yuborish</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== SOZLAMALAR ===== */
const ADMIN_PASSWORD = "gold9999";

// Firebase Realtime Database ma'lumotlarini shu yerga qo'ying.
// Bo'sh qoldirilsa, chat faqat shu brauzerning ichida (bir xil qurilmadagi tablarda) ishlaydi.
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "",   // masalan: https://loyiha-default-rtdb.firebaseio.com
  projectId: "",
  appId: ""
};
/* ====================== */

const $ = id => document.getElementById(id);
const listEl = $("list"), statusEl = $("status"), adminBtn = $("adminBtn");
let isAdmin = false;
let messages = {};                    // id -> {name, text, time}
const myId = localStorage.getItem("chat_uid") || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
localStorage.setItem("chat_uid", myId);
$("nick").value = localStorage.getItem("chat_nick") || "";

/* ---------- Saqlash qatlami (Firebase yoki local) ---------- */
let store;
if (FIREBASE_CONFIG.databaseURL) {
  firebase.initializeApp(FIREBASE_CONFIG);
  const ref = firebase.database().ref("messages");
  store = {
    send: m => ref.push(m),
    remove: id => ref.child(id).remove(),
    listen: cb => { ref.limitToLast(200).on("value", s => { cb(s.val() || {}); statusEl.textContent = "Onlayn"; }); }
  };
} else {
  const KEY = "chat_messages_local", bc = "BroadcastChannel" in window ? new BroadcastChannel("chat") : null;
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const write = o => { localStorage.setItem(KEY, JSON.stringify(o)); bc && bc.postMessage(1); };
  let cbk = () => {};
  store = {
    send: m => { const o = read(); o["m" + Date.now() + Math.random().toString(36).slice(2,6)] = m; write(o); cbk(read()); },
    remove: id => { const o = read(); delete o[id]; write(o); cbk(read()); },
    listen: cb => { cbk = cb; cb(read()); statusEl.textContent = "Mahalliy rejim";
      bc && (bc.onmessage = () => cb(read())); window.addEventListener("storage", () => cb(read())); }
  };
  const w = $("warn");
  w.hidden = false;
  w.textContent = "Firebase ulanmagan: xabarlar faqat shu qurilmada ko'rinadi. Hammaga ko'rinishi uchun FIREBASE_CONFIG ni to'ldiring.";
}

/* ---------- Chiqarish ---------- */
function render(data) {
  messages = data;
  const ids = Object.keys(data).sort((a, b) => (data[a].time || 0) - (data[b].time || 0));
  const nearBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 80;
  listEl.innerHTML = "";
  if (!ids.length) {
    const e = document.createElement("div");
    e.className = "empty"; e.textContent = "Hozircha xabar yo'q. Birinchi bo'lib yozing.";
    listEl.appendChild(e); return;
  }
  for (const id of ids) {
    const m = data[id];
    const el = document.createElement("div");
    el.className = "msg" + (m.uid === myId ? " mine" : "");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = (m.name || "Noma'lum") + " · " + new Date(m.time || 0).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    const row = document.createElement("div"); row.className = "row";
    const t = document.createElement("div"); t.textContent = m.text;   // textContent: XSS dan himoya
    row.appendChild(t);
    if (isAdmin) {
      const d = document.createElement("button");
      d.className = "del"; d.type = "button"; d.textContent = "O'chirish";
      d.onclick = () => store.remove(id);
      row.appendChild(d);
    }
    el.append(meta, row);
    listEl.appendChild(el);
  }
  if (nearBottom) listEl.scrollTop = listEl.scrollHeight;
}

/* ---------- Yuborish ---------- */
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("nick").value.trim().slice(0, 20), text = $("text").value.trim().slice(0, 500);
  if (!name || !text) return;
  localStorage.setItem("chat_nick", name);
  store.send({ name, text, uid: myId, time: Date.now() });
  $("text").value = "";
  setTimeout(() => listEl.scrollTop = listEl.scrollHeight, 50);
});

/* ---------- Admin panel ---------- */
adminBtn.addEventListener("click", () => {
  if (isAdmin) { isAdmin = false; adminBtn.textContent = "Admin panel"; adminBtn.className = "btn ghost"; render(messages); return; }
  const p = prompt("Admin parolini kiriting:");
  if (p === null) return;
  if (p === ADMIN_PASSWORD) {
    isAdmin = true; adminBtn.textContent = "Admindan chiqish"; adminBtn.className = "btn admin-on"; render(messages);
  } else alert("Parol noto'g'ri.");
});

store.listen(render);
</script>
</body>
</html>
